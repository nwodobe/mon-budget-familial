name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: dldcstmgxklumcvynlou
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Missing repository secret SUPABASE_ACCESS_TOKEN.'
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy delete-account with JWT verification
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy verify-play-purchase with JWT verification
        run: supabase functions deploy verify-play-purchase --project-ref "$SUPABASE_PROJECT_REF"

      - name: Security note
        run: echo 'JWT verification remains enabled because --no-verify-jwt is intentionally not used.'
